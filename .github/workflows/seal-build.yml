name: seal-build

# Build-and-pack only: the test suite runs on Travis (.travis.yml).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Pin notice.txt copyright year to the release's
        run: |
          sed -i "s/expand(copyright: new Date().format('yyyy')/expand(copyright: '2020'/" build.gradle
          grep -n "expand(copyright" build.gradle
      - name: Build jar
        run: ./gradlew :spring-kafka:jar --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: spring-kafka-jar
          path: spring-kafka/build/libs/spring-kafka-2.3.5.RELEASE.jar
          if-no-files-found: error
